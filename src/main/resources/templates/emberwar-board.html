<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Emberwar Board</title>
    <style>
        .board {
            display: grid;
            grid-template-columns: repeat(10, 50px); /* adjust size & columns */
            gap: 2px;
        }
        .tile {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #333;
        }
        .tile.GRASS { background-color: lightgreen; }
        .tile.WATER { background-color: lightblue; }
        .tile.MOUNTAIN { background-color: grey; }
        /* Add more tile types as needed */
    </style>
</head>
<body>
<h1>Emberwar Board</h1>

<div class="board">
    <!-- Loop through y rows and x columns -->
    <th:block th:each="y : ${#numbers.sequence(0, game.board.height - 1)}">
        <th:block th:each="x : ${#numbers.sequence(0, game.board.width - 1)}">
            <div class="tile" th:classappend="${game.board.getTileAt(x, y)?.type}">
                <span th:text="${game.board.getTileAt(x, y)?.type}">?</span>
            </div>
        </th:block>
    </th:block>
</div>

</body>
</html>
